<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="546" viewBox="0 0 1120 546" role="img">
<title>Pipeline workflow: load, split, fill missing data, train and balance, tune tree models, compare on the held-out test set</title>
<rect x="1" y="1" width="1118" height="544" rx="22" fill="#081421"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#63E4F0"/></marker></defs>
<text x="40" y="43" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#C7F980">PIPELINE WORKFLOW</text><text x="40" y="79" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#F4F8FB">From customer records to an understandable risk signal.</text><rect x="40" y="116" width="320" height="128" rx="16" fill="#102638" stroke="#2D5164"/><circle cx="70" cy="146" r="15" fill="#63E4F0"/><text x="65" y="152" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#081421">1</text><text x="97" y="152" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F8FB">LOAD &amp; SELECT</text><text x="63" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#A5BECD">4,600 customer records</text><text x="63" y="207" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#A5BECD">16 input fields + risk label</text><text x="63" y="228" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#91AABB">Exclude customer ID and raw date.</text><rect x="400" y="116" width="320" height="128" rx="16" fill="#102638" stroke="#2D5164"/><circle cx="430" cy="146" r="15" fill="#63E4F0"/><text x="425" y="152" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#081421">2</text><text x="457" y="152" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F8FB">SPLIT THE DATA</text><text x="423" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#A5BECD">80% training: 3,680 customers</text><text x="423" y="207" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#A5BECD">20% testing: 920 customers</text><text x="423" y="228" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#91AABB">Keep the test set out of training.</text><rect x="760" y="116" width="320" height="128" rx="16" fill="#102638" stroke="#2D5164"/><circle cx="790" cy="146" r="15" fill="#63E4F0"/><text x="785" y="152" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#081421">3</text><text x="817" y="152" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F8FB">FILL THE GAPS</text><text x="783" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#A5BECD">Scale numbers; KNN imputation</text><text x="783" y="207" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#A5BECD">Fill missing categories by mode</text><text x="783" y="228" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#91AABB">Learn filling rules on training only.</text><rect x="760" y="306" width="320" height="128" rx="16" fill="#102638" stroke="#2D5164"/><circle cx="790" cy="336" r="15" fill="#63E4F0"/><text x="785" y="342" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#081421">4</text><text x="817" y="342" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F8FB">PREPARE &amp; TRAIN</text><text x="783" y="374" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#A5BECD">Encode categories where used</text><text x="783" y="397" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#A5BECD">Balance training data only</text><text x="783" y="418" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#91AABB">Compare LR, Decision Tree and RF.</text><rect x="400" y="306" width="320" height="128" rx="16" fill="#102638" stroke="#2D5164"/><circle cx="430" cy="336" r="15" fill="#63E4F0"/><text x="425" y="342" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#081421">5</text><text x="457" y="342" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F8FB">TUNE TREE MODELS</text><text x="423" y="374" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#A5BECD">Randomized search: tree + forest</text><text x="423" y="397" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#A5BECD">Grid search: Random Forest</text><text x="423" y="418" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#91AABB">Optimize using high-risk recall.</text><rect x="40" y="306" width="320" height="128" rx="16" fill="#102638" stroke="#2D5164"/><circle cx="70" cy="336" r="15" fill="#C7F980"/><text x="65" y="342" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#081421">6</text><text x="97" y="342" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F8FB">COMPARE &amp; CHECK</text><text x="63" y="374" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#A5BECD">Recall, F1 and false negatives</text><text x="63" y="397" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#A5BECD">ROC-AUC from each model</text><text x="63" y="418" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#91AABB">Validate the reported model choice.</text><path d="M360 180H396" fill="none" stroke="#63E4F0" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M720 180H756" fill="none" stroke="#63E4F0" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M920 244V302" fill="none" stroke="#63E4F0" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M760 370H724" fill="none" stroke="#63E4F0" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M400 370H364" fill="none" stroke="#63E4F0" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M560 244V273H200V302" fill="none" stroke="#627F90" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="226" y="264" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="#91AABB">HELD-OUT TEST DATA → MATCHING PREPROCESSING</text><rect x="40" y="465" width="1040" height="52" rx="12" fill="#132C36" stroke="#365C62"/><text x="60" y="496" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="#C7F980">RECOMMENDED NEXT STEP</text><text x="282" y="496" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#D4E3E8">Independent validation → human-reviewed screening, not automatic rejection.</text></svg>